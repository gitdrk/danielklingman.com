<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Cake Neuron Sim</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050512;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    /* UI Overlay Container */
    #ui-layer {
      position: fixed;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none; 
      z-index: 10;
    }

    /* Info Box */
    .panel {
      padding: 10px 14px;
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 13px;
      pointer-events: auto; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      min-width: 200px;
    }

    .title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #00ffc8;
    }

    /* Controls */
    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
    }
    button:hover { background: #444; }
    button:active { background: #222; }

    input[type=range] {
      width: 100%;
      cursor: pointer;
      /* CRITICAL CHANGE: This flips the slider axis */
      /* Left side becomes MAX (100), Right side becomes MIN (0) */
      direction: rtl; 
    }
    
    label {
        font-weight: 500;
        color: #ddd;
    }

    /* ---- BOTTOM TRACK BAR ---- */
    #track-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px; 
      background: rgba(10, 10, 30, 0.9);
      border-top: 1px solid #444;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 0 20px; 
      box-sizing: border-box; 
    }

    /* The target (RIGHT) */
    #cake-target {
      position: absolute;
      right: 20px; 
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    /* The moving marker (STARTS LEFT) */
    #face-marker {
      position: absolute;
      left: 20px; 
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      transition: left 0.1s ease-out; 
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
      cursor: grab;
      user-select: none;
    }
    
    #face-marker:active {
      cursor: grabbing;
      transition: none;
    }

    /* Visual "Road" line */
    #track-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #333, #00ffc8);
      position: absolute;
      bottom: 20px;
      left: 0;
      z-index: -1;
      opacity: 0.5;
    }

    canvas {
      display: block;
    }
    
    /* Popup Modal */
    #warranty-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 60, 0.95);
      border: 2px solid #ff6b9d;
      border-radius: 12px;
      padding: 30px;
      z-index: 100;
      display: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      text-align: center;
      min-width: 320px;
      animation: popupAppear 0.3s ease-out;
    }
    
    @keyframes popupAppear {
      from {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
      }
      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }
    
    #warranty-popup.show {
      display: block;
    }
    
    #warranty-popup h2 {
      color: #ff6b9d;
      margin: 0 0 15px 0;
      font-size: 20px;
    }
    
    #warranty-popup p {
      color: #f5f5f5;
      margin: 0 0 20px 0;
      font-size: 14px;
      line-height: 1.4;
    }
    
    #warranty-link {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b9d, #ff8c00);
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
    }
    
    #warranty-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6);
    }
    
    #popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 99;
      display: none;
    }
    
    #popup-overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <div id="ui-layer">
    <div class="panel">
      <div class="title">Cookie Cake Brain Simulator</div>
    </div>

    <div class="panel">
      <div class="control-group">
        <label for="dist-range">Distance from Cookie Cake</label>
      </div>
      <div class="control-group">
        <span id="dist-val" style="color:#00ffc8; font-weight:bold;">100m</span>
      </div>
      <div class="control-group">
        <input type="range" id="dist-range" min="0" max="100" step="1" value="100">
      </div>
      <div class="control-group">
        <button id="btn-pause">Pause Simulation</button>
      </div>
    </div>

    <div class="panel">
      <div class="title">Neural Activity</div>
      <div style="margin-top: 6px; font-size: 12px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>Active Neurons:</span>
          <span id="active-neurons" style="color:#00ffc8; font-weight:bold;">0</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>Signals In Flight:</span>
          <span id="signals-count" style="color:#ff8c00; font-weight:bold;">0</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>Firing Rate:</span>
          <span id="fire-rate" style="color:#ff6b9d; font-weight:bold;">0/s</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>Simulation Speed:</span>
          <span id="sim-speed" style="color:#9d88ff; font-weight:bold;">0.1x</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span>Avg Activation:</span>
          <span id="avg-activation" style="color:#70ff70; font-weight:bold;">0%</span>
        </div>
      </div>
    </div>
  </div>

  <div id="track-container">
    <div id="track-line"></div>
    
    <div id="face-marker">😐</div>
    <div id="cake-target">🍪</div>
  </div>

  <canvas id="neurons"></canvas>
  
  <div id="popup-overlay"></div>
  <div id="warranty-popup">
    <h2>🚗 Important Notice! 🚗</h2>
    <p>Click here to extend your car's warranty.<br><strong>Smart people do it.</strong></p>
    <a id="warranty-link" href="https://x.com" target="_blank">Extend Warranty Now</a>
  </div>

  <script>
    const canvas = document.getElementById("neurons");
    const ctx = canvas.getContext("2d");

    // ---- State & Controls ----
    let simulationSpeed = 0.1; 
    let isPaused = false;
    
    const distRange = document.getElementById('dist-range');
    const distVal = document.getElementById('dist-val');
    const btnPause = document.getElementById('btn-pause');
    const faceMarker = document.getElementById('face-marker');
    
    // Metric display elements
    const activeNeuronsEl = document.getElementById('active-neurons');
    const signalsCountEl = document.getElementById('signals-count');
    const fireRateEl = document.getElementById('fire-rate');
    const simSpeedEl = document.getElementById('sim-speed');
    const avgActivationEl = document.getElementById('avg-activation');
    
    // Metrics tracking
    let firingEvents = 0;
    let metricsTimer = 0;
    let totalFiringCount = 0;
    let popupShown = false;
    
    // Dragging state
    let isDragging = false;
    let dragStartX = 0;
    let dragStartLeft = 0;

    // Function to calculate distance from pixel position
    function updateStateFromPixels(pixelPos) {
      const maxLeft = window.innerWidth - 80;
      const minLeft = 20;
      const progress = (pixelPos - minLeft) / (maxLeft - minLeft);
      const clampedProgress = Math.max(0, Math.min(1, progress));
      const distance = Math.round(100 - (clampedProgress * 100));
      
      distRange.value = distance;
      updateState(distance);
    }
    
    // Function to calculate speed based on slider value (100 down to 0)
    function updateState(sliderValue) {
      // 1. TEXT UPDATE
      // Slider is now direct: 100 = 100m, 0 = 0m
      distVal.innerText = sliderValue + "m";

      // 2. MATH
      // We need to calculate progress (0.0 to 1.0) based on distance
      // If Val = 100, Progress = 0.0 (Start)
      // If Val = 0, Progress = 1.0 (Finish)
      const progress = (100 - sliderValue) / 100;

      // 3. NEURON SPEED 
      // Progress 0 (Start) = Slow (0.1)
      // Progress 1 (End)   = Fast (5.0)
      const maxSpeed = 5.0;
      const minSpeed = 0.1;
      simulationSpeed = minSpeed + (progress * (maxSpeed - minSpeed));
      
      // Update speed display
      simSpeedEl.innerText = simulationSpeed.toFixed(2) + "x";

      // 4. FACE POSITION 
      // Progress 0 => Left side
      // Progress 1 => Right side
      const maxLeft = window.innerWidth - 80; 
      const minLeft = 20; 
      const pixelPos = minLeft + (progress * (maxLeft - minLeft));
      faceMarker.style.left = pixelPos + "px";
    }

    // Initialize (Start at 100)
    updateState(100);

    distRange.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      updateState(val);
    });

    window.addEventListener('resize', () => {
       const val = parseInt(distRange.value);
       updateState(val);
    });

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.innerText = isPaused ? "Resume" : "Pause Simulation";
      btnPause.style.background = isPaused ? "#522" : "#333";
    });
    
    // Face dragging functionality
    faceMarker.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartLeft = parseFloat(faceMarker.style.left) || 20;
      e.preventDefault();
    });
    
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaX = e.clientX - dragStartX;
        const newLeft = dragStartLeft + deltaX;
        const maxLeft = window.innerWidth - 80;
        const minLeft = 20;
        const clampedLeft = Math.max(minLeft, Math.min(maxLeft, newLeft));
        
        faceMarker.style.left = clampedLeft + 'px';
        updateStateFromPixels(clampedLeft);
      }
    });
    
    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // Touch support for mobile
    faceMarker.addEventListener('touchstart', (e) => {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartLeft = parseFloat(faceMarker.style.left) || 20;
      e.preventDefault();
    });
    
    window.addEventListener('touchmove', (e) => {
      if (isDragging) {
        const deltaX = e.touches[0].clientX - dragStartX;
        const newLeft = dragStartLeft + deltaX;
        const maxLeft = window.innerWidth - 80;
        const minLeft = 20;
        const clampedLeft = Math.max(minLeft, Math.min(maxLeft, newLeft));
        
        faceMarker.style.left = clampedLeft + 'px';
        updateStateFromPixels(clampedLeft);
      }
    });
    
    window.addEventListener('touchend', () => {
      isDragging = false;
    });
    
    // Close popup when clicking overlay
    document.getElementById('popup-overlay').addEventListener('click', () => {
      document.getElementById('warranty-popup').classList.remove('show');
      document.getElementById('popup-overlay').classList.remove('show');
    });

    // ---- Resizing Logic ----
    let prevW = window.innerWidth;
    let prevH = window.innerHeight;

    function resize() {
      const newW = window.innerWidth;
      const newH = window.innerHeight;
      
      const scaleX = prevW > 0 ? newW / prevW : 1;
      const scaleY = prevH > 0 ? newH / prevH : 1;

      canvas.width = newW;
      canvas.height = newH;

      if (neurons.length > 0) {
        neurons.forEach(n => { n.x *= scaleX; n.y *= scaleY; });
        signals.forEach(s => { s.fromX *= scaleX; s.fromY *= scaleY; s.toX *= scaleX; s.toY *= scaleY; });
      }
      prevW = newW;
      prevH = newH;
      
      updateState(parseInt(distRange.value));
    }
    
    window.addEventListener("resize", resize);

    // ---- Simulation parameters ----
    const NUM_NEURONS = 45;
    const MIN_CONNECTIONS = 2;
    const MAX_CONNECTIONS = 5;

    const neurons = [];
    const signals = []; 

    function randBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Initialize Neurons
    for (let i = 0; i < NUM_NEURONS; i++) {
      neurons.push({
        x: 0, 
        y: 0,
        connections: [],
        activation: 0,   
        threshold: 0.9, 
        refractory: 0,
        justFired: 0, // Timer for red spark effect
      });
    }

    resize(); 
    
    function randomizePositions() {
      const margin = 50;
      for (const n of neurons) {
        n.x = randBetween(margin, canvas.width - margin);
        n.y = randBetween(margin, canvas.height - margin);
      }
    }
    randomizePositions();

    // Create Connections
    for (let i = 0; i < neurons.length; i++) {
      const n = neurons[i];
      const numConnections = Math.floor(randBetween(MIN_CONNECTIONS, MAX_CONNECTIONS + 1));
      while (n.connections.length < numConnections) {
        const targetIndex = Math.floor(Math.random() * neurons.length);
        if (targetIndex !== i && !n.connections.includes(targetIndex)) {
          n.connections.push(targetIndex);
        }
      }
    }

    // Seed activation
    for (const n of neurons) {
      n.activation = Math.random() * 0.5;
    }

    function addSignal(fromIndex, toIndex) {
      const from = neurons[fromIndex];
      const to = neurons[toIndex];
      signals.push({
        fromIndex,
        toIndex,
        t: 0,
        speed: randBetween(0.01, 0.03),
        fromX: from.x,
        fromY: from.y,
        toX: to.x,
        toY: to.y,
      });
    }

    function step() {
      if (isPaused) return;

      const dt = 1 / 60;
      
      // Update neurons
      for (let i = 0; i < neurons.length; i++) {
        const n = neurons[i];

        if (Math.random() < 0.02 * simulationSpeed) {
          n.activation += randBetween(0.05, 0.2);
        }

        if (n.refractory > 0) {
          n.refractory -= dt * simulationSpeed;
        } else {
          // Fixed decay for persistence
          n.activation -= 0.01;
        }

        if (n.activation < 0) n.activation = 0;
        if (n.activation > 1.5) n.activation = 1.5;

        // Fire
        if (n.refractory <= 0 && n.activation >= n.threshold) {
          n.refractory = 0.4;      
          n.activation = 1.2;
          n.justFired = 0.15; // Set red spark duration
          firingEvents++; // Track firing for rate calculation
          totalFiringCount++;
          
          // Show popup after 10 fires
          if (totalFiringCount === 10 && !popupShown) {
            document.getElementById('warranty-popup').classList.add('show');
            document.getElementById('popup-overlay').classList.add('show');
            popupShown = true;
          }

          for (const targetIndex of n.connections) {
            addSignal(i, targetIndex);
          }
        }
        
        // Decay firing effect
        if (n.justFired > 0) {
          n.justFired -= dt * simulationSpeed;
          if (n.justFired < 0) n.justFired = 0;
        }
      }

      // Update signals
      for (let i = signals.length - 1; i >= 0; i--) {
        const s = signals[i];
        s.t += s.speed * simulationSpeed;
        if (s.t >= 1) {
          const target = neurons[s.toIndex];
          target.activation += randBetween(0.3, 0.6);
          signals.splice(i, 1);
        }
      }
      
      // Update metrics every frame
      updateMetrics(dt);
    }
    
    function updateMetrics(dt) {
      metricsTimer += dt;
      
      // Update metrics display every 0.1 seconds
      if (metricsTimer >= 0.1) {
        // Count active neurons (above threshold or in refractory)
        const activeCount = neurons.filter(n => n.activation > 0.5 || n.refractory > 0).length;
        activeNeuronsEl.innerText = activeCount;
        
        // Signals in flight
        signalsCountEl.innerText = signals.length;
        
        // Firing rate (events per second)
        const firingRate = (firingEvents / metricsTimer).toFixed(1);
        fireRateEl.innerText = firingRate + "/s";
        firingEvents = 0;
        metricsTimer = 0;
        
        // Average activation across all neurons
        const totalActivation = neurons.reduce((sum, n) => sum + n.activation, 0);
        const avgActivation = ((totalActivation / neurons.length) * 100).toFixed(0);
        avgActivationEl.innerText = avgActivation + "%";
      }
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;

      // Persistence effect
      ctx.fillStyle = "rgba(5, 5, 20, 0.05)"; 
      ctx.fillRect(0, 0, w, h);

      // Draw connections
      ctx.lineWidth = 1;
      for (let i = 0; i < neurons.length; i++) {
        const n = neurons[i];
        for (const j of n.connections) {
          const m = neurons[j];
          ctx.strokeStyle = "rgba(120, 120, 160, 0.15)";
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(m.x, m.y);
          ctx.stroke();
        }
      }

      // Draw signals
      for (const s of signals) {
        const x = s.fromX + (s.toX - s.fromX) * s.t;
        const y = s.fromY + (s.toY - s.fromY) * s.t;

        ctx.beginPath();
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(0, 255, 255, 1)";
        ctx.fillStyle = "rgba(200, 255, 255, 1)";
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; 
      }

      // Draw neurons
      for (const n of neurons) {
        const a = Math.min(1, n.activation);
        
        // Check if neuron is firing (red spark effect)
        let r, g, b;
        if (n.justFired > 0) {
          // Red spark effect - interpolate from bright red to normal color
          const sparkIntensity = n.justFired / 0.15; // 0 to 1
          const normalR = 80 + a * 175;
          const normalG = 140 + a * 115;
          const normalB = 230 + a * 25;
          
          r = normalR + (255 - normalR) * sparkIntensity;
          g = normalG * (1 - sparkIntensity * 0.7);
          b = normalB * (1 - sparkIntensity * 0.9);
        } else {
          // Normal color palette
          r = 80 + a * 175;  
          g = 140 + a * 115; 
          b = 230 + a * 25;
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 1)`;
        
        const radius = 4 + a * 6;
        
        // Add extra glow when firing
        if (n.justFired > 0) {
          ctx.shadowBlur = 12;
          ctx.shadowColor = `rgba(255, 50, 50, ${n.justFired / 0.15})`;
        }
        
        ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
      }
    }

    function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
